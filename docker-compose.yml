version: "3"
services:
    postgres:
        image: postgres:16
        ports:
            - 5432:5432
        volumes:
            - postgres_db:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=ina_zaoui
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_USER=postgres

    pgadmin:
        image: dpage/pgadmin4:latest
        ports:
            - 8080:80
        environment:
            - PGADMIN_DEFAULT_EMAIL=admin@admin.com
            - PGADMIN_DEFAULT_PASSWORD=admin
        depends_on:
            - postgres

volumes:
    postgres_db:
